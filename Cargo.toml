[package]
name = "nportx"
version = "0.3.0"
edition = "2021"
authors = ["Nx Conglo"]
description = "Find and kill processes hogging your ports. Instantly. Cross-platform."
license = "MIT"
repository = "https://github.com/nxt3r/nportx"
readme = "README.md"
keywords = ["ports", "cli", "tui", "process", "devtools"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
netstat2 = "0.11.2"
sysinfo = "0.39.6"
ratatui = "0.28"
crossterm = "0.28"
clap_complete = "4"
serde_json = "1"
regex = "1"